# ===================================================================
# FDMS BANGLADESH - Backend Configuration (Spring Boot 3.3+)
# Fertilizer Dealer & Distribution Management System
# ===================================================================

spring.application.name=fdms-backend
server.port=8080

# -------------------------------------------------------------------
# Java 21 Project Loom - Virtual Threads for High-Throughput I/O
# -------------------------------------------------------------------
spring.threads.virtual.enabled=true

# -------------------------------------------------------------------
# PostgreSQL Database Configuration (Compatible with PostgreSQL 15-18)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fdms_bangladesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT (JSON Web Token) Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.fdms=DEBUG
logging.level.org.springframework.security=INFO

